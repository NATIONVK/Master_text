<!DOCTYPE html>
<html lang="bn">

<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
:root{--b:rgba(255,160,220,.35);--pk:#ff7eb6;--lv:#c9b6ff;--tx:#f6eefe}
html,body{height:100%;overflow:hidden;color:var(--tx);font-family:'Hind Siliguri','Noto Sans Bengali','Nirmala UI','Kalpurush',system-ui,sans-serif;background:radial-gradient(ellipse at 20% 8%,#4a1d7a,transparent 55%),radial-gradient(ellipse at 85% 95%,#7a1d5a88,transparent 50%),linear-gradient(160deg,#1a0f3d,#0d1033 60%,#120a2e)}
#bg,#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#fx{z-index:50;width:100%;height:100%}
.star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:tw 3s infinite ease-in-out}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
.fh{position:absolute;bottom:-30px;opacity:0;animation:rise linear forwards}

.shoot{position:absolute;width:90px;height:2px;background:linear-gradient(90deg,transparent,#fff);animation:sh 1.3s linear forwards}
@keyframes sh{from{transform:translate(0,0) rotate(30deg);opacity:1}to{transform:translate(320px,185px) rotate(30deg);opacity:0}}
#stage{position:fixed;inset:0;z-index:5}
.page{position:absolute;inset:0;display:flex;padding:calc(env(safe-area-inset-top) + 54px) 16px calc(88px + env(safe-area-inset-bottom));overflow-y:auto;overflow-x:hidden;touch-action:pan-y;opacity:0;visibility:hidden;transform:translateX(40px) scale(.98);transition:opacity .6s,transform .6s,visibility .6s}
.page.past{transform:translateX(-40px) scale(.98)}
.page.on{opacity:1;visibility:visible;transform:none}
.in{margin:auto;width:100%;max-width:560px;text-align:center}
.on .in>*{animation:up .8s both;animation-delay:calc(var(--i,0)*.12s)}
@keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes fi{from{opacity:0}to{opacity:1}}
h2,.big{background:linear-gradient(90deg,#ffd1ec,#ff7eb6,#c9b6ff,#ffd1ec);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gs 6s linear infinite;line-height:1.35;margin-bottom:14px;filter:drop-shadow(0 0 14px rgba(255,126,182,.45))}

.tag{font-size:2rem;margin-bottom:4px}
p{font-size:1.06rem;line-height:1.95;margin-bottom:.9em}
.card{background:rgba(255,255,255,.08);border:1px solid var(--b);border-radius:22px;padding:20px 18px;box-shadow:0 8px 32px rgba(0,0,0,.35),0 0 24px rgba(255,126,182,.15);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);margin-bottom:16px}

.sub{font-size:1.15rem;color:#ffe6f4}.hint{color:var(--lv);font-size:.95rem}
.date{display:inline-block;padding:8px 20px;border-radius:30px;border:1px solid var(--b);background:rgba(255,126,182,.14);letter-spacing:.2em;font-weight:700;margin-bottom:14px;animation:gl 2.5s infinite alternate}

.heart.slow{font-size:70px;animation-duration:2.6s}
@keyframes hb{0%,100%{transform:scale(1)}15%{transform:scale(1.14)}30%{transform:scale(1)}45%{transform:scale(1.1)}}
.bds{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:6px 0 14px}
.bd{padding:9px 16px;border-radius:30px;background:rgba(201,182,255,.15);border:1px solid var(--b);box-shadow:0 0 14px rgba(201,182,255,.25);animation:fl 3.2s ease-in-out infinite;animation-delay:var(--d)}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.orb{position:relative;width:170px;height:170px;margin:0 auto 16px}
.r{position:absolute;border:1px solid rgba(255,160,220,.45);border-radius:50%;animation:spin linear infinite}
.r1{inset:0;animation-duration:12s}.r2{inset:22px;animation-duration:8s;animation-direction:reverse}.r3{inset:44px;animation-duration:5s}
.r u{position:absolute;top:-4px;left:50%;width:8px;height:8px;border-radius:50%;background:var(--pk);box-shadow:0 0 12px var(--pk)}
@keyframes spin{to{transform:rotate(360deg)}}
.hc{position:absolute;inset:0;display:grid;place-items:center;font-size:44px}
.paper{background:#fff6e8;color:#4a2c3a;font-family:'Atma','Hind Siliguri','Noto Sans Bengali','Nirmala UI',cursive;text-align:left;padding:22px 20px;border-radius:6px;transform:rotate(-1.5deg);box-shadow:0 12px 34px rgba(0,0,0,.5);margin-bottom:16px;background-image:repeating-linear-gradient(transparent 0 33px,#e9d6c0 33px 34px)}
.paper.warm{transform:rotate(1.2deg);box-shadow:0 12px 34px rgba(0,0,0,.5),0 0 40px rgba(255,170,120,.5)}
.paper p{font-size:1.05rem;line-height:34px;margin:0 0 34px}
.paper p:last-child{margin-bottom:0}
.on .paper{animation:pin 1.4s .2s both}
@keyframes pin{from{opacity:0;transform:translateY(40px) rotate(-6deg)}}
.wg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.wc{padding:16px 8px;border-radius:18px;background:rgba(255,255,255,.09);border:1px solid var(--b);font-size:1.05rem;box-shadow:0 0 16px rgba(255,126,182,.15);animation:up .8s both;animation-delay:calc(.4s + var(--j)*.25s)}
.on .wg .wc{animation-name:up}
.page:not(.on) .wc{animation:none;opacity:0}
.nl{display:grid;gap:10px;margin-bottom:16px}
.nl .wc{text-align:center}
.btn{min-height:50px;padding:12px 26px;border-radius:30px;border:1px solid #ffb3da;background:linear-gradient(135deg,#ff5fa8,#9b5cff);color:#fff;font:inherit;font-weight:700;font-size:1.05rem;cursor:pointer;box-shadow:0 0 22px rgba(255,95,168,.6);animation:gl 2s infinite alternate}
.big-gift{font-size:110px;line-height:1.1;animation:bnc 1.6s ease-in-out infinite;filter:drop-shadow(0 0 24px #ff7eb6);display:inline-block}
@keyframes bnc{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-18px) rotate(3deg)}}
.qm{position:relative;height:30px;margin-bottom:10px}
.qm i{position:absolute;font-style:normal;font-size:1.6rem;color:var(--lv);animation:fl 2.4s infinite}
.gifts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding-top:50px;margin-bottom:14px}
.gift{position:relative;height:150px;border:0;background:none;color:inherit;font:inherit;cursor:pointer;animation:fl 3.4s ease-in-out infinite;animation-delay:var(--d);min-width:0}
.sh{position:absolute;left:14%;right:14%;bottom:14px;height:10px;border-radius:50%;background:rgba(0,0,0,.5);filter:blur(3px)}
.gb{position:absolute;left:14%;width:72%;bottom:22px;height:76px;z-index:2;border-radius:6px;background:linear-gradient(90deg,transparent 43%,#ffe27a 43% 57%,transparent 57%),linear-gradient(160deg,#ff5fa8,#a23cc4);box-shadow:0 0 18px rgba(255,126,182,.7),inset 0 0 0 1px rgba(255,255,255,.35)}
.gift:nth-child(2) .gb{background:linear-gradient(90deg,transparent 43%,#fff 43% 57%,transparent 57%),linear-gradient(160deg,#7a8bff,#6a2cc4)}
.gift:nth-child(3) .gb{background:linear-gradient(90deg,transparent 43%,#ffe27a 43% 57%,transparent 57%),linear-gradient(160deg,#ff8aa8,#d03c7c)}
.lid{position:absolute;left:8%;width:84%;bottom:94px;height:26px;z-index:3;border-radius:6px;transform-origin:0 100%;background:linear-gradient(90deg,transparent 43%,#ffe27a 43% 57%,transparent 57%),linear-gradient(160deg,#ff7eb6,#b44cd0);box-shadow:0 0 14px rgba(255,126,182,.6),inset 0 0 0 1px rgba(255,255,255,.4);transition:transform .9s cubic-bezier(.3,1.4,.5,1),opacity .9s .3s}
.bow{position:absolute;left:50%;top:-20px;transform:translateX(-50%);font-style:normal;font-size:24px;line-height:1}
.gift.open .lid{transform:translate(-24px,-46px) rotate(-52deg);opacity:.35}
.pn{position:absolute;left:26%;width:48%;height:58px;bottom:36px;z-index:1;background:#fff6e8;border-radius:3px;box-shadow:0 0 14px #fff8;background-image:repeating-linear-gradient(transparent 0 8px,#d9c3b0 8px 9px);transition:transform 1s .35s cubic-bezier(.2,1.2,.4,1)}
.gift.open .pn{transform:translateY(-78px) rotate(-4deg);z-index:4}
.gl{position:absolute;left:0;right:0;bottom:-6px;font-size:.78rem;font-weight:500;color:#ffd1ec}
.note{min-height:96px;border-radius:14px;padding:16px;margin-bottom:16px;background:#fff6e8;color:#4a2c3a;line-height:1.85;font-size:1.05rem;box-shadow:0 8px 26px rgba(0,0,0,.4);font-family:inherit}
.note.ph{background:rgba(255,255,255,.08);color:var(--lv);border:1px dashed var(--b);box-shadow:none}
.note.show{animation:paper .8s both}
@keyframes paper{from{clip-path:inset(0 0 100% 0);opacity:0;transform:translateY(-14px)}to{clip-path:inset(0);opacity:1;transform:none}}
.ew{position:relative;margin-bottom:16px}
.env{display:block;position:relative;width:240px;height:160px;margin:34px auto 20px;border:0;background:none;color:inherit;font:inherit;cursor:pointer;animation:fl 3s infinite;transition:opacity .6s,transform .6s,height .6s,margin .6s}
.eb{position:absolute;inset:0;border-radius:8px;background:#b95f98;box-shadow:0 0 34px #ff7eb688}
.et{position:absolute;left:12%;width:76%;top:8%;height:82%;background:#fff6e8;border-radius:4px;z-index:1;transition:transform 1s .6s}
.ef{position:absolute;inset:0;z-index:3;background:linear-gradient(135deg,#e592c2,#c46aa0);clip-path:polygon(0 100%,0 30%,50% 64%,100% 30%,100% 100%);border-radius:0 0 8px 8px}
.fp{position:absolute;inset:0;z-index:4;background:#d77fb2;clip-path:polygon(0 0,100% 0,50% 64%);transform-origin:top;border-radius:8px 8px 0 0;transition:transform .7s,z-index 0s .35s}
.sl{position:absolute;left:50%;top:50%;z-index:5;transform:translate(-50%,-50%);font-size:34px;color:#ff3d8f;text-shadow:0 0 14px #fff8;animation:hb 1.5s infinite;transition:opacity .4s}
.ew.open .fp{transform:rotateX(180deg);z-index:0}
.ew.open .et{transform:translateY(-70px)}
.ew.open .sl{opacity:0}
.ew.done .env{opacity:0;transform:scale(.6);height:0;margin:0;pointer-events:none;overflow:hidden}
.lc{display:none;position:relative;margin-top:6px}
.ew.done .lc{display:block;animation:up .9s both}
.lc .paper{transform:rotate(0);animation:none}
.ew.done .lc p{animation:fi 1.2s both;animation-delay:calc(var(--k)*.55s)}
.hh{position:absolute;color:#ff7eb6;text-shadow:0 0 10px #ff7eb6;animation:fl 2.2s infinite}
.pr{font-size:1.1rem;color:#ffd1ec;margin-top:6px}
.hid{max-height:0;overflow:hidden;opacity:0;transition:max-height 1s,opacity 1s,margin 1s}
.hid.show{max-height:600px;opacity:1;margin-top:16px}
.bls{display:flex;justify-content:center;gap:16px;margin-bottom:6px}
.bl{position:relative;width:42px;height:54px;border-radius:50% 50% 50% 50%/42% 42% 58% 58%;background:var(--c);box-shadow:inset -6px -6px 10px rgba(0,0,0,.18),0 0 16px var(--c);animation:fl 3.6s ease-in-out infinite;animation-delay:var(--d)}
.bl:after{content:'';position:absolute;left:50%;top:100%;width:1px;height:34px;background:#fff6}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
#bar{position:fixed;top:0;left:0;height:3px;width:0;z-index:30;background:linear-gradient(90deg,#ff7eb6,#c9b6ff);box-shadow:0 0 10px #ff7eb6;transition:width .5s}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;align-items:center;gap:10px;padding:14px 14px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#0d0a24ee 45%)}
.nb{min-height:46px;min-width:98px;padding:0 16px;border-radius:24px;border:1px solid var(--b);background:rgba(255,126,182,.18);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.nb:active,.btn:active{transform:scale(.95)}
#cnt{flex:1;text-align:center;letter-spacing:.15em;font-weight:700;color:#ffd1ec}
#mu{position:fixed;z-index:30;right:12px;top:calc(env(safe-area-inset-top) + 10px);min-height:38px;padding:0 14px;border-radius:20px;border:1px solid var(--b);background:rgba(13,10,36,.6);color:#ffd1ec;font:inherit;font-size:.85rem;cursor:pointer}
button:focus-visible{outline:2px solid #fff;outline-offset:3px}
@media(max-width:360px){.gifts{gap:2px}.gl{font-size:.68rem}p{font-size:1rem}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>

var L13='একটা কথা বলি?\n\nতোমার সঙ্গে কথা বলার কিছু মুহূর্ত হয়তো খুব সাধারণ। তবু কখনো কখনো সেই সাধারণ মুহূর্তগুলোই দিনের শেষে মনে পড়ে যায়।\n\n\n\nকিছু অনুভূতি সুন্দর থাকে, যখন সেগুলোকে ধীরে ধীরে নিজের মতো থাকতে দেওয়া হয়।\n\nতুমি ভালো থেকো, নিজের মতো করে। আর তোমার হাসিটা যেন এমনই থাকে। ♡';

var pages=[
/*1*/'<div class="date">23 · 10 · 2026</div><div class="Heart"></div><h2 class="big">Happy Birthday!</h2><div class="tag">🎂</div><p class="sub">আজকের দিনটা একটু বেশি সুন্দর হোক তোমার,,,,কারণ আজকের দিনেই তুমি পৃথিবীতে এসেছিলে </p><p class="hint">তোর জন্য ছোট একটা Gift,,,  নিচে দেখোও Next batton click করোও পরের পেইজে নিবে ...…</p>',

/*3*/hd('💖',' I hope life surprises you in the sweetest ways')+'<div class="orb"><i class="r r1"><u></u></i><i class="r r2"><u></u></i><i class="r r3"><u></u></i><span class="hc">💞</span></div>'+cd('সব মানুষের সঙ্গে কথা হয়, কিন্তু সবার সঙ্গে কথা বললে মনটা হালকা হয় না,,,, তুমি আমার কাছে তেমনই একজন,,,,,, একজন close friend, যার সাথে মোটামুটি অনেক কিছু বলা যায় '),
/*4*/hd('🌙','একটু soft কথা…')+'<div class="heart slow">💝</div>'+cd(' etuku maya thakuk, kono tarahuro charai. kichu anubhuti sundor thake, jokhon taader naam dewar dorkar hoy na. ')+qt('“Some people feel like a little peace in a noisy world.”'),
/*5*/hd('💌','একটা ছোট্ট চিরকুট')+'<div class="paper">'+T('প্রিয় তুমি,\n\nজীবন সবসময় সহজ হবে না। কিছু দিন ক্লান্ত লাগবে, কিছু ইচ্ছে দেরি করবে, কিছু মানুষ বুঝতেও পারবে না তুমি কতটা চেষ্টা করছ।\n\nতবু নিজের প্রতি কোমল থেকো।\n\nতুমি যতটা ভাবো, তার চেয়েও বেশি ভালো জিনিস তোমার প্রাপ্য। নিজের আলোটা নিভতে দিয়ো না।\n\nআর হ্যাঁ,,মন খারাপ হলে মনে রেখো, তোমার ভালো থাকাটা সত্যিই গুরুত্বপূর্ণ।\n\n তোমার এক close friend ♡')+'</div>',
